<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="800" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#001520"/><stop offset="100%" stop-color="#000810"/>
    </linearGradient>
    <radialGradient id="glow" cx="400" cy="200" r="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.3"/><stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <rect width="800" height="450" fill="url(#glow)"/>
  <pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M40 0L0 0L0 40" fill="none" stroke="#06b6d4" stroke-opacity="0.05" stroke-width="1"/>
  </pattern>
  <rect width="800" height="450" fill="url(#g)"/>
  <!-- Neural network nodes -->
  <!-- Layer 1 -->
  <circle cx="160" cy="150" r="18" fill="none" stroke="#06b6d4" stroke-width="2" stroke-opacity="0.8"/>
  <circle cx="160" cy="225" r="18" fill="none" stroke="#06b6d4" stroke-width="2" stroke-opacity="0.8"/>
  <circle cx="160" cy="300" r="18" fill="none" stroke="#06b6d4" stroke-width="2" stroke-opacity="0.8"/>
  <!-- Layer 2 -->
  <circle cx="300" cy="125" r="18" fill="#06b6d4" fill-opacity="0.1" stroke="#06b6d4" stroke-width="2" stroke-opacity="0.9"/>
  <circle cx="300" cy="200" r="18" fill="#06b6d4" fill-opacity="0.1" stroke="#06b6d4" stroke-width="2" stroke-opacity="0.9"/>
  <circle cx="300" cy="275" r="18" fill="#06b6d4" fill-opacity="0.1" stroke="#06b6d4" stroke-width="2" stroke-opacity="0.9"/>
  <circle cx="300" cy="350" r="18" fill="#06b6d4" fill-opacity="0.1" stroke="#06b6d4" stroke-width="2" stroke-opacity="0.9"/>
  <!-- Layer 3 (center - AI brain) -->
  <circle cx="450" cy="160" r="22" fill="#06b6d4" fill-opacity="0.2" stroke="#06b6d4" stroke-width="2.5"/>
  <circle cx="450" cy="225" r="28" fill="#06b6d4" fill-opacity="0.25" stroke="#06b6d4" stroke-width="3"/>
  <circle cx="450" cy="290" r="22" fill="#06b6d4" fill-opacity="0.2" stroke="#06b6d4" stroke-width="2.5"/>
  <!-- Layer 4 -->
  <circle cx="600" cy="175" r="18" fill="none" stroke="#8b5cf6" stroke-width="2" stroke-opacity="0.9"/>
  <circle cx="600" cy="275" r="18" fill="none" stroke="#8b5cf6" stroke-width="2" stroke-opacity="0.9"/>
  <!-- Connections L1→L2 -->
  <line x1="178" y1="150" x2="282" y2="125" stroke="#06b6d4" stroke-opacity="0.2" stroke-width="1"/>
  <line x1="178" y1="150" x2="282" y2="200" stroke="#06b6d4" stroke-opacity="0.2" stroke-width="1"/>
  <line x1="178" y1="225" x2="282" y2="200" stroke="#06b6d4" stroke-opacity="0.3" stroke-width="1.5"/>
  <line x1="178" y1="225" x2="282" y2="275" stroke="#06b6d4" stroke-opacity="0.2" stroke-width="1"/>
  <line x1="178" y1="300" x2="282" y2="275" stroke="#06b6d4" stroke-opacity="0.2" stroke-width="1"/>
  <line x1="178" y1="300" x2="282" y2="350" stroke="#06b6d4" stroke-opacity="0.2" stroke-width="1"/>
  <!-- Connections L2→L3 -->
  <line x1="318" y1="125" x2="428" y2="160" stroke="#06b6d4" stroke-opacity="0.25" stroke-width="1.5"/>
  <line x1="318" y1="200" x2="422" y2="225" stroke="#06b6d4" stroke-opacity="0.4" stroke-width="2"/>
  <line x1="318" y1="275" x2="428" y2="290" stroke="#06b6d4" stroke-opacity="0.25" stroke-width="1.5"/>
  <line x1="318" y1="350" x2="428" y2="290" stroke="#06b6d4" stroke-opacity="0.2" stroke-width="1"/>
  <!-- Connections L3→L4 -->
  <line x1="472" y1="225" x2="582" y2="175" stroke="#8b5cf6" stroke-opacity="0.4" stroke-width="2"/>
  <line x1="472" y1="225" x2="582" y2="275" stroke="#8b5cf6" stroke-opacity="0.4" stroke-width="2"/>
  <!-- AI text in center node -->
  <text x="450" y="231" font-family="system-ui" font-size="13" font-weight="900" fill="#06b6d4" text-anchor="middle">AI</text>
  <!-- Output labels -->
  <rect x="628" y="163" width="90" height="24" rx="12" fill="#8b5cf6" fill-opacity="0.15" stroke="#8b5cf6" stroke-opacity="0.5" stroke-width="1"/>
  <text x="673" y="179" font-family="system-ui" font-size="10" font-weight="600" fill="#8b5cf6" text-anchor="middle">Qualify Lead</text>
  <rect x="628" y="263" width="90" height="24" rx="12" fill="#8b5cf6" fill-opacity="0.15" stroke="#8b5cf6" stroke-opacity="0.5" stroke-width="1"/>
  <text x="673" y="279" font-family="system-ui" font-size="10" font-weight="600" fill="#8b5cf6" text-anchor="middle">Book Appt</text>
  <!-- Floating data bits -->
  <text x="90" y="385" font-family="monospace" font-size="10" fill="#06b6d4" fill-opacity="0.3">01001010 10110101</text>
  <text x="490" y="400" font-family="monospace" font-size="10" fill="#8b5cf6" fill-opacity="0.3">11010011 00101110</text>
  <rect x="0" y="0" width="800" height="4" fill="#06b6d4"/>
  <rect x="30" y="30" width="130" height="32" rx="16" fill="#06b6d4" fill-opacity="0.12" stroke="#06b6d4" stroke-opacity="0.5" stroke-width="1.5"/>
  <text x="48" y="51" font-family="system-ui" font-size="13" font-weight="700" fill="#06b6d4">AI AUTOMATION</text>
</svg>