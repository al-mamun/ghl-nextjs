<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="800" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0d0520"/><stop offset="100%" stop-color="#060010"/>
    </linearGradient>
    <radialGradient id="glow" cx="400" cy="225" r="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.3"/><stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <rect width="800" height="450" fill="url(#glow)"/>
  <pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse">
    <circle cx="1" cy="1" r="1" fill="#8b5cf6" fill-opacity="0.07"/>
  </pattern>
  <rect width="800" height="450" fill="url(#g)"/>
  <!-- Workflow diagram: nodes connected by lines -->
  <!-- Trigger node -->
  <rect x="60" y="195" width="120" height="60" rx="10" fill="#8b5cf6" fill-opacity="0.2" stroke="#8b5cf6" stroke-width="2" stroke-opacity="0.9"/>
  <text x="120" y="220" font-family="system-ui" font-size="11" font-weight="700" fill="#c084fc" text-anchor="middle">⚡ TRIGGER</text>
  <text x="120" y="238" font-family="system-ui" font-size="10" fill="#94a3b8" text-anchor="middle">Form Submitted</text>
  <!-- Arrow 1 -->
  <line x1="180" y1="225" x2="230" y2="225" stroke="#8b5cf6" stroke-width="2" stroke-opacity="0.7"/>
  <polygon points="230,220 240,225 230,230" fill="#8b5cf6" fill-opacity="0.7"/>
  <!-- Delay node -->
  <rect x="240" y="195" width="110" height="60" rx="10" fill="#6366f1" fill-opacity="0.2" stroke="#6366f1" stroke-width="2" stroke-opacity="0.9"/>
  <text x="295" y="220" font-family="system-ui" font-size="11" font-weight="700" fill="#818cf8" text-anchor="middle">⏱ WAIT</text>
  <text x="295" y="238" font-family="system-ui" font-size="10" fill="#94a3b8" text-anchor="middle">5 minutes</text>
  <!-- Arrow 2 -->
  <line x1="350" y1="225" x2="400" y2="225" stroke="#6366f1" stroke-width="2" stroke-opacity="0.7"/>
  <polygon points="400,220 410,225 400,230" fill="#6366f1" fill-opacity="0.7"/>
  <!-- SMS Action -->
  <rect x="410" y="170" width="110" height="55" rx="10" fill="#06b6d4" fill-opacity="0.15" stroke="#06b6d4" stroke-width="2" stroke-opacity="0.9"/>
  <text x="465" y="193" font-family="system-ui" font-size="11" font-weight="700" fill="#38bdf8" text-anchor="middle">💬 SMS</text>
  <text x="465" y="211" font-family="system-ui" font-size="10" fill="#94a3b8" text-anchor="middle">Instant Reply</text>
  <!-- Split line down -->
  <line x1="465" y1="225" x2="465" y2="260" stroke="#6366f1" stroke-width="1.5" stroke-opacity="0.5" stroke-dasharray="4,3"/>
  <!-- Email Action -->
  <rect x="410" y="265" width="110" height="55" rx="10" fill="#10b981" fill-opacity="0.12" stroke="#10b981" stroke-width="2" stroke-opacity="0.9"/>
  <text x="465" y="288" font-family="system-ui" font-size="11" font-weight="700" fill="#34d399" text-anchor="middle">📧 EMAIL</text>
  <text x="465" y="306" font-family="system-ui" font-size="10" fill="#94a3b8" text-anchor="middle">Welcome Seq.</text>
  <!-- Arrow 3 -->
  <line x1="520" y1="197" x2="580" y2="197" stroke="#06b6d4" stroke-width="2" stroke-opacity="0.7"/>
  <polygon points="580,192 590,197 580,202" fill="#06b6d4" fill-opacity="0.7"/>
  <line x1="520" y1="292" x2="580" y2="292" stroke="#10b981" stroke-width="2" stroke-opacity="0.7"/>
  <polygon points="580,287 590,292 580,297" fill="#10b981" fill-opacity="0.7"/>
  <!-- CRM Update -->
  <rect x="590" y="175" width="130" height="60" rx="10" fill="#f59e0b" fill-opacity="0.12" stroke="#f59e0b" stroke-width="2" stroke-opacity="0.9"/>
  <text x="655" y="198" font-family="system-ui" font-size="11" font-weight="700" fill="#fbbf24" text-anchor="middle">🗂 CRM UPDATE</text>
  <text x="655" y="216" font-family="system-ui" font-size="10" fill="#94a3b8" text-anchor="middle">Move Pipeline Stage</text>
  <!-- Result badge -->
  <rect x="590" y="260" width="130" height="55" rx="10" fill="#10b981" fill-opacity="0.1" stroke="#10b981" stroke-width="2" stroke-opacity="0.7"/>
  <text x="655" y="281" font-family="system-ui" font-size="10" fill="#94a3b8" text-anchor="middle">Automations Active</text>
  <text x="655" y="302" font-family="system-ui" font-size="22" font-weight="900" fill="#10b981" text-anchor="middle">156</text>
  <!-- Status indicators -->
  <circle cx="45" cy="390" r="5" fill="#10b981"/>
  <text x="58" y="395" font-family="system-ui" font-size="11" fill="#94a3b8">Running 24/7 — no human action required</text>
  <rect x="0" y="0" width="800" height="4" fill="#8b5cf6"/>
  <rect x="30" y="30" width="110" height="32" rx="16" fill="#8b5cf6" fill-opacity="0.12" stroke="#8b5cf6" stroke-opacity="0.5" stroke-width="1.5"/>
  <text x="48" y="51" font-family="system-ui" font-size="13" font-weight="700" fill="#c084fc">AUTOMATION</text>
</svg>