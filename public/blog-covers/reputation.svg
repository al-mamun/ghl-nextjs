<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="800" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#001a0a"/><stop offset="100%" stop-color="#000d05"/>
    </linearGradient>
    <radialGradient id="glow" cx="400" cy="200" r="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.25"/><stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <rect width="800" height="450" fill="url(#glow)"/>
  <pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse">
    <circle cx="1" cy="1" r="1" fill="#10b981" fill-opacity="0.06"/>
  </pattern>
  <rect width="800" height="450" fill="url(#g)"/>
  <!-- Large rating display -->
  <text x="250" y="200" font-family="system-ui" font-size="90" font-weight="900" fill="#10b981" fill-opacity="0.9" text-anchor="middle">4.9</text>
  <text x="250" y="240" font-family="system-ui" font-size="32" fill="#fbbf24" text-anchor="middle">★★★★★</text>
  <text x="250" y="268" font-family="system-ui" font-size="13" fill="#94a3b8" text-anchor="middle">from 247 Google reviews</text>
  <!-- Review cards -->
  <rect x="450" y="80" width="310" height="90" rx="10" fill="#10b981" fill-opacity="0.08" stroke="#10b981" stroke-opacity="0.3" stroke-width="1"/>
  <text x="468" y="105" font-family="system-ui" font-size="13" fill="#fbbf24">★★★★★</text>
  <text x="468" y="124" font-family="system-ui" font-size="11" fill="#cbd5e1" font-style="italic">"Completely transformed our follow-up.</text>
  <text x="468" y="140" font-family="system-ui" font-size="11" fill="#cbd5e1" font-style="italic">Leads respond in minutes now."</text>
  <text x="468" y="158" font-family="system-ui" font-size="10" fill="#64748b">— Sarah M., Cleaning Business</text>
  <rect x="450" y="185" width="310" height="90" rx="10" fill="#10b981" fill-opacity="0.08" stroke="#10b981" stroke-opacity="0.3" stroke-width="1"/>
  <text x="468" y="210" font-family="system-ui" font-size="13" fill="#fbbf24">★★★★★</text>
  <text x="468" y="229" font-family="system-ui" font-size="11" fill="#cbd5e1" font-style="italic">"Close rate went from 12% to 28% in</text>
  <text x="468" y="245" font-family="system-ui" font-size="11" fill="#cbd5e1" font-style="italic">30 days. Incredible system."</text>
  <text x="468" y="263" font-family="system-ui" font-size="10" fill="#64748b">— James R., Home Services</text>
  <rect x="450" y="290" width="310" height="90" rx="10" fill="#10b981" fill-opacity="0.08" stroke="#10b981" stroke-opacity="0.3" stroke-width="1"/>
  <text x="468" y="315" font-family="system-ui" font-size="13" fill="#fbbf24">★★★★★</text>
  <text x="468" y="334" font-family="system-ui" font-size="11" fill="#cbd5e1" font-style="italic">"No-shows dropped from 35% to 8%.</text>
  <text x="468" y="350" font-family="system-ui" font-size="11" fill="#cbd5e1" font-style="italic">The reminder system is flawless."</text>
  <text x="468" y="368" font-family="system-ui" font-size="10" fill="#64748b">— Mike T., Fitness Studio</text>
  <!-- Review count growth -->
  <rect x="60" y="310" width="340" height="60" rx="10" fill="#10b981" fill-opacity="0.08" stroke="#10b981" stroke-opacity="0.3" stroke-width="1"/>
  <text x="230" y="335" font-family="system-ui" font-size="11" fill="#94a3b8" text-anchor="middle">Reviews generated in 60 days</text>
  <text x="230" y="358" font-family="system-ui" font-size="22" font-weight="900" fill="#10b981" text-anchor="middle">19 → 57 ★★★★★</text>
  <rect x="0" y="0" width="800" height="4" fill="#10b981"/>
  <rect x="30" y="30" width="110" height="32" rx="16" fill="#10b981" fill-opacity="0.12" stroke="#10b981" stroke-opacity="0.5" stroke-width="1.5"/>
  <text x="48" y="51" font-family="system-ui" font-size="13" font-weight="700" fill="#34d399">REPUTATION</text>
</svg>