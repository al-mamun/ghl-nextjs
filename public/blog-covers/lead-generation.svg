<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="800" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#001a0d"/><stop offset="100%" stop-color="#000d06"/>
    </linearGradient>
    <radialGradient id="glow" cx="400" cy="200" r="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.28"/><stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <rect width="800" height="450" fill="url(#glow)"/>
  <pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse">
    <circle cx="1" cy="1" r="1" fill="#10b981" fill-opacity="0.06"/>
  </pattern>
  <rect width="800" height="450" fill="url(#g)"/>
  <!-- Funnel shape -->
  <polygon points="250,80 550,80 490,200 310,200" fill="#10b981" fill-opacity="0.1" stroke="#10b981" stroke-width="2" stroke-opacity="0.8"/>
  <polygon points="310,210 490,210 450,310 350,310" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="2" stroke-opacity="0.8"/>
  <polygon points="350,320 450,320 420,390 380,390" fill="#10b981" fill-opacity="0.25" stroke="#10b981" stroke-width="2.5" stroke-opacity="0.9"/>
  <!-- Funnel labels -->
  <text x="400" y="148" font-family="system-ui" font-size="13" font-weight="700" fill="#10b981" text-anchor="middle" fill-opacity="0.9">AWARENESS</text>
  <text x="400" y="268" font-family="system-ui" font-size="12" font-weight="700" fill="#10b981" text-anchor="middle">QUALIFIED</text>
  <text x="400" y="362" font-family="system-ui" font-size="11" font-weight="700" fill="#10b981" text-anchor="middle">CLOSE</text>
  <!-- Lead icons entering top -->
  <circle cx="300" cy="55" r="14" fill="none" stroke="#10b981" stroke-width="2" stroke-opacity="0.6"/>
  <text x="300" y="61" font-family="system-ui" font-size="12" text-anchor="middle" fill="#10b981" fill-opacity="0.8">👤</text>
  <circle cx="355" cy="45" r="14" fill="none" stroke="#10b981" stroke-width="2" stroke-opacity="0.6"/>
  <text x="355" y="51" font-family="system-ui" font-size="12" text-anchor="middle" fill="#10b981" fill-opacity="0.8">👤</text>
  <circle cx="410" cy="50" r="14" fill="none" stroke="#10b981" stroke-width="2" stroke-opacity="0.6"/>
  <text x="410" y="56" font-family="system-ui" font-size="12" text-anchor="middle" fill="#10b981" fill-opacity="0.8">👤</text>
  <circle cx="465" cy="42" r="14" fill="none" stroke="#10b981" stroke-width="2" stroke-opacity="0.6"/>
  <text x="465" y="48" font-family="system-ui" font-size="12" text-anchor="middle" fill="#10b981" fill-opacity="0.8">👤</text>
  <!-- Stats right side -->
  <rect x="600" y="100" width="160" height="70" rx="10" fill="#10b981" fill-opacity="0.08" stroke="#10b981" stroke-opacity="0.3" stroke-width="1"/>
  <text x="680" y="128" font-family="system-ui" font-size="28" font-weight="900" fill="#10b981" text-anchor="middle">47</text>
  <text x="680" y="148" font-family="system-ui" font-size="11" fill="#94a3b8" text-anchor="middle">New Leads Today</text>
  <text x="680" y="162" font-family="system-ui" font-size="11" font-weight="700" fill="#10b981" text-anchor="middle">▲ 23%</text>
  <rect x="600" y="190" width="160" height="70" rx="10" fill="#10b981" fill-opacity="0.08" stroke="#10b981" stroke-opacity="0.3" stroke-width="1"/>
  <text x="680" y="218" font-family="system-ui" font-size="28" font-weight="900" fill="#10b981" text-anchor="middle">28%</text>
  <text x="680" y="238" font-family="system-ui" font-size="11" fill="#94a3b8" text-anchor="middle">Close Rate</text>
  <text x="680" y="252" font-family="system-ui" font-size="11" font-weight="700" fill="#10b981" text-anchor="middle">▲ 16% MoM</text>
  <!-- Response time -->
  <rect x="30" y="180" width="160" height="50" rx="10" fill="#10b981" fill-opacity="0.08" stroke="#10b981" stroke-opacity="0.3" stroke-width="1"/>
  <text x="110" y="203" font-family="system-ui" font-size="11" fill="#94a3b8" text-anchor="middle">Response Time</text>
  <text x="110" y="220" font-family="system-ui" font-size="14" font-weight="900" fill="#10b981" text-anchor="middle">&lt; 60 seconds</text>
  <rect x="0" y="0" width="800" height="4" fill="#10b981"/>
  <rect x="30" y="30" width="140" height="32" rx="16" fill="#10b981" fill-opacity="0.12" stroke="#10b981" stroke-opacity="0.5" stroke-width="1.5"/>
  <text x="48" y="51" font-family="system-ui" font-size="13" font-weight="700" fill="#10b981">LEAD GENERATION</text>
</svg>