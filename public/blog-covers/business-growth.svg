<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="800" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0d0520"/><stop offset="100%" stop-color="#060010"/>
    </linearGradient>
    <radialGradient id="glow" cx="400" cy="225" r="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.25"/><stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <rect width="800" height="450" fill="url(#glow)"/>
  <pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse">
    <circle cx="1" cy="1" r="1" fill="#8b5cf6" fill-opacity="0.07"/>
  </pattern>
  <rect width="800" height="450" fill="url(#g)"/>
  <!-- Bar chart -->
  <line x1="80" y1="360" x2="720" y2="360" stroke="#334155" stroke-width="1.5"/>
  <!-- Bars growing left to right -->
  <rect x="110" y="300" width="60" height="60" rx="6" fill="#8b5cf6" fill-opacity="0.4" stroke="#8b5cf6" stroke-opacity="0.6" stroke-width="1"/>
  <text x="140" y="380" font-family="system-ui" font-size="10" fill="#64748b" text-anchor="middle">Jan</text>
  <text x="140" y="296" font-family="system-ui" font-size="10" fill="#a78bfa" text-anchor="middle">$12k</text>
  <rect x="190" y="270" width="60" height="90" rx="6" fill="#8b5cf6" fill-opacity="0.5" stroke="#8b5cf6" stroke-opacity="0.7" stroke-width="1"/>
  <text x="220" y="380" font-family="system-ui" font-size="10" fill="#64748b" text-anchor="middle">Feb</text>
  <text x="220" y="266" font-family="system-ui" font-size="10" fill="#a78bfa" text-anchor="middle">$15k</text>
  <rect x="270" y="240" width="60" height="120" rx="6" fill="#8b5cf6" fill-opacity="0.6" stroke="#8b5cf6" stroke-opacity="0.8" stroke-width="1"/>
  <text x="300" y="380" font-family="system-ui" font-size="10" fill="#64748b" text-anchor="middle">Mar</text>
  <text x="300" y="236" font-family="system-ui" font-size="10" fill="#a78bfa" text-anchor="middle">$19k</text>
  <rect x="350" y="200" width="60" height="160" rx="6" fill="#8b5cf6" fill-opacity="0.7" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="380" y="380" font-family="system-ui" font-size="10" fill="#64748b" text-anchor="middle">Apr</text>
  <text x="380" y="196" font-family="system-ui" font-size="10" fill="#a78bfa" text-anchor="middle">$24k</text>
  <rect x="430" y="150" width="60" height="210" rx="6" fill="#8b5cf6" fill-opacity="0.8" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="460" y="380" font-family="system-ui" font-size="10" fill="#64748b" text-anchor="middle">May</text>
  <text x="460" y="146" font-family="system-ui" font-size="10" fill="#a78bfa" text-anchor="middle">$28k</text>
  <rect x="510" y="100" width="60" height="260" rx="6" fill="#8b5cf6" stroke="#8b5cf6" stroke-width="2"/>
  <text x="540" y="380" font-family="system-ui" font-size="10" fill="#94a3b8" text-anchor="middle">Jun</text>
  <text x="540" y="96" font-family="system-ui" font-size="12" font-weight="700" fill="#c084fc" text-anchor="middle">$30k</text>
  <!-- Up arrow trend line -->
  <polyline points="140,300 220,270 300,240 380,200 460,150 540,100" fill="none" stroke="#c084fc" stroke-width="2" stroke-opacity="0.5" stroke-dasharray="6,4"/>
  <!-- Growth stat -->
  <rect x="610" y="140" width="150" height="80" rx="12" fill="#8b5cf6" fill-opacity="0.1" stroke="#8b5cf6" stroke-opacity="0.3" stroke-width="1.5"/>
  <text x="685" y="175" font-family="system-ui" font-size="38" font-weight="900" fill="#c084fc" text-anchor="middle">2.5x</text>
  <text x="685" y="200" font-family="system-ui" font-size="11" fill="#94a3b8" text-anchor="middle">revenue in 6 months</text>
  <rect x="610" y="240" width="150" height="60" rx="12" fill="#10b981" fill-opacity="0.08" stroke="#10b981" stroke-opacity="0.3" stroke-width="1"/>
  <text x="685" y="268" font-family="system-ui" font-size="11" fill="#94a3b8" text-anchor="middle">Manual hours/week</text>
  <text x="685" y="288" font-family="system-ui" font-size="18" font-weight="900" fill="#10b981" text-anchor="middle">12h → &lt;1h</text>
  <rect x="0" y="0" width="800" height="4" fill="#8b5cf6"/>
  <rect x="30" y="30" width="150" height="32" rx="16" fill="#8b5cf6" fill-opacity="0.12" stroke="#8b5cf6" stroke-opacity="0.5" stroke-width="1.5"/>
  <text x="48" y="51" font-family="system-ui" font-size="13" font-weight="700" fill="#c084fc">BUSINESS GROWTH</text>
</svg>